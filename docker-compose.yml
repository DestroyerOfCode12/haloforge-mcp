version: "3.8"

services:
  haloforge-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haloforge-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3000}:3000"
    environment:
      # Required
      - HALO_BASE_URL=${HALO_BASE_URL}
      # Public URL that the reverse proxy exposes (for OAuth metadata)
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://haloforge.example.com}
      # Safety (defaults: read only, no delete)
      - HALO_MODE=${HALO_MODE:-read}
      - HALO_DISABLE_DELETE=${HALO_DISABLE_DELETE:-true}
      - HALO_WRITE_ALLOWLIST=${HALO_WRITE_ALLOWLIST:-}
      - HALO_AUDIT_LOG=/app/logs/audit.jsonl
      # Optional
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_TRANSPORT=http
      - MCP_AUTH=oauth
      - MCP_PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/app/logs
